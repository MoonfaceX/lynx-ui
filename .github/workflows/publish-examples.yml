name: Publish Examples

on:
  push:
    branches: [
      "main",
    ]

# Set default minimum permissions to prevent unnecessary access
permissions: {}

env:
  CI: 1
  TURBO_TELEMETRY_DISABLED: 1
  NPM_CONFIG_PROVENANCE: true

jobs:
  publish-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'lynx-family/lynx-ui'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    environment: npm
    permissions:
      contents: read
      # `id-token: write` is required for npm provenance
      # See: https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install
        run: |
          git submodule update --init --recursive --remote
          npm install -g corepack@latest
          corepack enable && corepack prepare
          corepack pnpm install --frozen-lockfile
      - name: Detect changed examples
        id: changed
        run: |
          # Use turbo's dependency-aware filter to find example packages
          # affected by changes since the previous commit (including transitive deps).
          CHANGED=$(corepack pnpm turbo build --filter='./apps/examples/*...[HEAD^]' --dry-run=json \
            | node -e "
              const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              const names = (data.tasks || [])
                .map(t => t.directory)
                .filter(d => d.startsWith('apps/examples/'))
                .map(d => d.replace('apps/examples/', ''));
              console.log(names.join(','));
            ")
          echo "examples=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No examples changed — skipping publish."
          else
            echo "Changed examples: $CHANGED"
          fi
      - name: Build changed examples
        if: steps.changed.outputs.examples != ''
        run: |
          corepack pnpm turbo build --filter='./apps/examples/*...[HEAD^]'
      - name: Publish changed examples
        if: steps.changed.outputs.examples != ''
        run: |
          # Convert comma-separated list to --filter flags
          FILTER_ARGS=""
          IFS=',' read -ra COMPONENTS <<< "${{ steps.changed.outputs.examples }}"
          for comp in "${COMPONENTS[@]}"; do
            FILTER_ARGS="$FILTER_ARGS --filter $comp"
          done
          corepack pnpm examples:publish $FILTER_ARGS
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_LYNX_EXAMPLES }}
